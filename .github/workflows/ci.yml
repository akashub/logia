name: Checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and UI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser UI contracts (synthetic recognition)
        run: |
          pnpm dev > "$RUNNER_TEMP/logia-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:1420/ > /dev/null
          pnpm test:ui

  desktop:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake clang
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Swift 6 toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
      - name: Frontend assets for the native build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Recognition transport tests
        run: cargo +1.95.0 test --manifest-path spikes/recognition/Cargo.toml --locked
      - name: Desktop tests and examples
        run: cargo +1.95.0 test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets
      - name: Desktop lint
        run: |
          echo "::add-matcher::.github/rust.json"
          cargo +1.95.0 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --message-format=short -- -D warnings
      - name: Build application (no signing or installer)
        run: cargo +1.95.0 build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Swift unit tests (no Accessibility access)
        if: runner.os == 'macOS'
        run: bash scripts/test-target-probe.sh
