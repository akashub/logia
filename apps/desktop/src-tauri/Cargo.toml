[package]
name = "logia-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-clipboard-manager = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
cpal = "=0.16.0"
rubato = "=0.16.2"
hound = "=3.5.1"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "=1.49.0", features = ["fs", "io-util"] }
transcribe-cpp = { version = "=0.2.3", default-features = false }
# Upstream requires exact binding/native patch-version agreement.
transcribe-cpp-sys = { version = "=0.2.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 2
debug = false

# Keep the personal debug preview's audio conversion and model hashing fast.
[profile.dev.package.logia-desktop]
opt-level = 1
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
